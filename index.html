<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tune Library</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" type="text/css" href="style.css?v=9">
  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <!-- Firebase Database -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
  <!-- Instrument Mode Buttons -->
  <div class="toggle-buttons">
    <button id="guitarBtn" class="active">Guitar</button>
    <button id="mandolinBtn">Mandolin</button>
  </div>
  
  <div id="content">
    <!-- Input Form for New Tune -->
    <div class="input-box">
      <input type="text" style="width: 250px" id="tuneName" placeholder="Tune Name">
      <!--<input type="number" style="width: 120px" id="knowledge" placeholder="Knowledge (1-5)" min="1" max="5"> -->
      <!--<input type="number" id="priority" placeholder="Priority (1-3)" min="1" max="3"> -->
      <button id="saveTune">Save</button>
      <button id="refreshbtn">↻</button>
      <button id="sortbtn">≡</button>
      <button id="setsBtn">Sets</button>
      <button id="addSetBtn" class="hidden">Add set</button>
      <button id="saveSetBtn" class="hidden">Save set</button>
      
    </div>
    

    <!-- Tune List -->
    <div class="tune-list" id="tuneList">
      <!-- Tune items will appear here -->
    
    </div>


    
<!-- Tune Details (Appears on clicking a tune) -->
<div class="tune-details hidden" id="tuneDetailsContainer">

<div id="editControls" class="edit-controls">
  <button id="editDetailsBtn">Edit</button>
  <button id="saveDetails" class="hidden">Save</button>
  <button id="clicklink" class="hidden">Link</button>
</div>

<div id="youtubeControls" class="player-controls">
  <div class="player-control-group">
    <button id="playPauseBtn" >⏵︎</button>
    <button class="speed-btn" data-speed="0.6">.6</button>
    <button class="speed-btn" data-speed="0.7">.7</button>
    <button class="speed-btn" data-speed="0.8">.8</button>
    <button class="speed-btn" data-speed="0.9">.9</button>
    <button class="speed-btn" data-speed="0.95">.95</button>
    <button class="speed-btn" data-speed="1">1</button>
    <button class="speed-btn" data-speed="1.05">1.05</button>
    <button class="speed-btn" data-speed="1.1">1.1</button>
    <button class="speed-btn" data-speed="1.2">1.2</button>
    <button id="skipBackBtn" title="Rewind 5 seconds">« </button>
    <button id="cueBtn">Cue</button>
        <input id="cueInput" type="number" step="0.1" style="width: 50px;" /> 
  </div>

  <div id="loopControls" class="player-control-group">
    <button id="loopBtn">Loop</button>
    <input id="loopInputstart" type="number" step="0.1" placeholder="⏵︎" style="width: 45px;" />
    <input id="loopInputend" type="number" step="0.1" placeholder="⏴︎" style="width: 45px;" />
    <input id="loopDelayInput" type="number" step="0.1" placeholder="⏸" style="width: 45px;" />
  </div>
</div>

 
    <div id="youtubePlayerContainer" class="hidden" style="margin-top: 10px; width: 100%; height: 0; padding-bottom: 56.25%; position: relative;"></div>
    <div id="setYoutubePlayers" class="set-youtube-players hidden">
      <div id="setYoutubePlayerA" class="set-youtube-player"></div>
      <div id="setYoutubePlayerB" class="set-youtube-player"></div>
    </div>

    <div id="setPlaybackPanel" class="hidden"></div>
    <div id="detailsDisplay"></div>
    <div id="detailsControls" class="details-controls">
        <button id="scrollToTopBtn">&larr;</button>
        <button id="startScrollBtn">Start Scroll</button>
        <button id="stopScrollBtn" disabled>Stop Scroll</button>
        <label for="scrollSpeed">Speed:</label>
        <input type="range" id="scrollSpeed" min="1" max="10" value="5">
    </div>




    <!-- Tune Details Textarea -->
    
    <div id="chordDiagramsContainer"  class="hidden"></div>

    <!-- Chord Input Box -->
   
<!-- Additional Edit Fields -->

 <div id="repertoireLinksEditor" class="hidden"></div>
<button id="addRepertoireLinkBtn" class="hidden">Add link</button><br> 
  <input type="text" id="nameInput" class="hidden" style="width: 190px;" placeholder="Name"><br>
  <input type="text" id="chordInput" class="hidden" style="width: 190px;"  rows="20" cols="1"placeholder="Chords ">
  <input type="text" id="linkInput" class="hidden" style="width: 570px;" placeholder="Link"><br>
  <input type="text" id="keyInput" class="hidden" style="width: 190px;" placeholder="Key"><br>
  <input type="text" id="typeInput" class="hidden" style="width: 190px;" placeholder="Type"><br>
  <input type="number" id="knowledgeInput" class="hidden" style="width: 190px;" placeholder="Knowledge (1-5)"> <br>
<textarea id="tuneDetails" class="hidden" rows="20" cols="60"></textarea>
</div>

    <br>

   
    <br>

    <!-- Buttons -->


</div>

  


  
  
  <!-- Link to external JavaScript file -->
  <script src="script.js?v=11"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
